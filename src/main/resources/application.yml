spring:
  application:
    name: design-patterns-showcase
  datasource:
    url: jdbc:h2:mem:patterns;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.example.designpatterns: DEBUG
